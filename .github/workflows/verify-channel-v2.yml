name: Verify the signed Transport NSK update from the live channel

on:
  push:
    branches:
      - updates-v2
    paths:
      - appcast.xml
      - recovery/channel/verify_native_update.py
      - .github/workflows/verify-channel-v2.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'SelfmotivationN1/transport-nsk-releases'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify the downloaded installer and apply it to a migrated app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONUTF8 = '1'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $root = Join-Path $env:RUNNER_TEMP 'transport-nsk-live-update-test'
          $installed = Join-Path $root 'installed'
          New-Item -ItemType Directory -Path $root | Out-Null
          $quiet = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-')
          $releases = 'https://github.com/SelfmotivationN1/transport-nsk-releases/releases/download'
          python -m pip install --disable-pip-version-check pyinstaller==6.21.0
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller installation failed.' }

          function Get-Checksum($url) {
            $response = (Invoke-WebRequest -Uri "$url.sha256").Content
            if ($response -is [byte[]]) { $response = [Text.Encoding]::ASCII.GetString($response) }
            $hash = ($response.Trim() -split '\s+')[0]
            if ($hash -notmatch '^[0-9a-f]{64}$') { throw 'The published checksum is malformed.' }
            $hash
          }
          function Assert-Hash($path, $checksum) {
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $checksum) {
              throw "Checksum mismatch for $path."
            }
          }
          function Run-Setup($path, $arguments) {
            $process = Start-Process -FilePath $path -ArgumentList $arguments -WindowStyle Hidden -PassThru
            if (!$process.WaitForExit(75000) -or $process.ExitCode -ne 0) { throw "Installer failed: $path" }
          }

          $old = Join-Path $root 'old.exe'
          $oldUrl = "$releases/v1.2.3/TransportNSK-1.2.3-Setup.exe"
          Invoke-WebRequest -Uri $oldUrl -OutFile $old
          Assert-Hash $old 'dda9a6d0d495834fc1bd96609c42ce5dd285c7142d16e00aedb30bc4d58877fd'
          Run-Setup $old ($quiet + @(('/DIR="{0}"' -f $installed), '/TASKS=""'))

          $bridge = Join-Path $root 'bridge.exe'
          $bridgeUrl = "$releases/v1.2.5-channel-v2/TransportNSK-1.2.5-Setup.exe"
          Invoke-WebRequest -Uri $bridgeUrl -OutFile $bridge
          Assert-Hash $bridge (Get-Checksum $bridgeUrl)
          Run-Setup $bridge $quiet
          $workspace = Get-ItemPropertyValue -LiteralPath 'HKCU:\Software\TransportNSK' -Name WorkspaceRoot
          $application = Join-Path $installed 'Транспорт НСК.exe'

          $smoke = Join-Path $root 'before.json'
          $process = Start-Process -FilePath $application -ArgumentList @('--smoke-test', ('"{0}"' -f $smoke)) -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(35000) -or $process.ExitCode -ne 0) { throw 'Migrated application failed to launch.' }
          $before = Get-Content -Raw -LiteralPath $smoke | ConvertFrom-Json
          if ($before.version -ne '1.2.5' -or $before.workspace -ne $workspace) { throw 'Unexpected migration result.' }
          $databaseHash = (Get-FileHash -LiteralPath $before.database -Algorithm SHA256).Hash

          [xml]$appcast = Get-Content -Raw -Encoding utf8 -LiteralPath 'appcast.xml'
          $update = $appcast.rss.channel.item.enclosure
          $expectedVersion = $update.GetAttribute('version', 'http://www.andymatuschak.org/xml-namespaces/sparkle')
          if ($update.url -ne "$releases/v$expectedVersion-channel-v2/TransportNSK-$expectedVersion-Setup.exe") {
            throw 'Unexpected URL in the feed.'
          }
          $installerHash = Get-Checksum $update.url
          $downloaded = Join-Path $root 'downloaded-and-verified.exe'
          $publicFeed = 'https://raw.githubusercontent.com/SelfmotivationN1/transport-nsk-releases/refs/heads/updates-v2/appcast.xml'
          for ($attempt = 0; $attempt -lt 15; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $publicFeed -TimeoutSec 10
              $feed = $response.Content
              if ($feed -is [byte[]]) { $feed = [Text.Encoding]::UTF8.GetString($feed) }
              if ($feed -like "*$($update.url)*") { break }
            } catch {
              if ($attempt -eq 14) { throw }
            }
            Start-Sleep -Seconds 2
          }
          python -B recovery/channel/verify_native_update.py $application $downloaded $installerHash
          if ($LASTEXITCODE -ne 0) { throw 'Native signature verification failed.' }

          Run-Setup $downloaded ($quiet + @('/FROMUPDATE=1', ('/DIR="{0}"' -f $installed), ('/WORKSPACE="{0}"' -f $workspace)))
          Assert-Hash $before.database $databaseHash
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            $restarted = @(Get-Process -ErrorAction SilentlyContinue | Where-Object Path -EQ $application)
            if ($restarted) { break }
            Start-Sleep -Seconds 1
          }
          if (!$restarted) { throw 'The downloaded update did not relaunch the application.' }
          foreach ($process in $restarted) {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -ErrorAction SilentlyContinue }
          }
          $smoke = Join-Path $root 'after.json'
          $process = Start-Process -FilePath $application -ArgumentList @('--smoke-test', ('"{0}"' -f $smoke)) -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(35000) -or $process.ExitCode -ne 0) { throw 'Updated application failed to launch.' }
          $after = Get-Content -Raw -LiteralPath $smoke | ConvertFrom-Json
          if ($after.version -ne $expectedVersion -or $after.database -ne $before.database -or $after.workspace -ne $workspace) {
            throw 'The update did not preserve the installed workspace and database.'
          }
